<!DOCTYPE html>
<html>
<head>
  <title>Share Your Business - SheLeads</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <h2>SheLeads</h2>

  <nav>
    <a href="index.html">Home</a>
    <a href="business.html">Business Ideas</a>
    <a href="success.html">Success Stories</a>
    <a href="contact.html">Contact</a>
    <a href="login.html" class="login">Login</a>
  </nav>
</header>

<div class="form-box">

  <h2>Share Your Business 🌸</h2>
  <p>Tell the SheLeads community about your business.</p>

  <form id="businessForm">

    <input type="text" id="owner"
           placeholder="Your Name" required>

    <input type="text" id="businessName"
           placeholder="Business Name" required>

    <input type="text" id="category"
           placeholder="Business Category" required>

    <textarea id="description"
              placeholder="Tell us about your business"
              required></textarea>

    <input type="tel" id="phone"
           placeholder="Contact Number" required>

    <input type="text" id="social"
           placeholder="Instagram / Social Media">

    <button type="submit">Submit Business</button>

  </form>

</div>

<footer>
  <p>© 2026 SheLeads | Empower. Inspire. Grow.</p>
</footer>

<script src="script.js"></script>

</body>
</html>
